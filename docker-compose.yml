# Local devnet: one block producer and one verifying replica.
# Create ./devnet first with `make devnet-init`.
services:
  producer:
    build: .
    command: ["-key", "/devnet/proposer.json", "-genesis", "/devnet/genesis.json", "-data", "/data"]
    volumes:
      - ./devnet:/devnet:ro
      - producer-data:/data
    ports:
      - "8080:8080"

  replica:
    build: .
    command: ["-follow", "http://producer:8080", "-genesis", "/devnet/genesis.json", "-data", "/data"]
    depends_on:
      - producer
    volumes:
      - ./devnet:/devnet:ro
      - replica-data:/data
    ports:
      - "8081:8080"

volumes:
  producer-data:
  replica-data:
