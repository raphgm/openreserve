# Production stack for one server: block producer, ORPay backend, and Caddy
# (HTTPS + the web wallet). See deploy/README.md.
services:
  node:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["-genesis", "/config/genesis.json", "-data", "/data", "-trust-proxy"]
    environment:
      ORP_PROPOSER_SEED: ${ORP_PROPOSER_SEED:?set ORP_PROPOSER_SEED in deploy/.env}
    volumes:
      - ./genesis.json:/config/genesis.json:ro
      - node-data:/data

  orpay-backend:
    build:
      context: ..
      dockerfile: apps/orpay/Dockerfile
      target: backend
    restart: unless-stopped
    command: ["-db", "/data/orpay-users.json", "-node", "http://node:8080", "-trust-proxy",
              "-public-url", "https://${DOMAIN}", "-default-currency", "NGN", "-card-payments"]
    environment:
      # Leave empty on networks with real value to disable the faucet.
      ORPAY_FAUCET_SEED: ${ORPAY_FAUCET_SEED:-}
      ORPAY_ADMINS: ${ORPAY_ADMINS:-}
    volumes:
      - orpay-data:/data
    depends_on: [node]

  gateway:
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    command: ["-data", "/data", "-node", "http://node:8080", "-backend", "http://orpay-backend:4000",
              "-public-url", "https://${DOMAIN}", "-trust-proxy"]
    environment:
      # Configure one or both providers.
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      FLW_SECRET_KEY: ${FLW_SECRET_KEY:-}
      FLW_SECRET_HASH: ${FLW_SECRET_HASH:-}
      ORP_ISSUER_SEED: ${ORP_ISSUER_SEED:?set ORP_ISSUER_SEED in deploy/.env}
    volumes:
      - gateway-data:/data
    depends_on: [node, orpay-backend]

  web:
    build:
      context: ..
      dockerfile: apps/orpay/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [node, orpay-backend, gateway]

volumes:
  node-data:
  orpay-data:
  gateway-data:
  caddy-data:
  caddy-config:
