<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORPay - The Global Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="app">
      <nav class="navbar">
        <div class="logo">ORPay</div>
        <div class="nav-links">
          <a href="#" class="active">Dashboard</a>
          <a href="#">Activity</a>
          <a href="#">Settings</a>
        </div>
        <div class="profile-chip">
          <div class="avatar"></div>
          <span id="display-username">@user</span>
        </div>
      </nav>

      <main class="container">
        <section class="balance-card glass-panel">
          <h3>Total Balance</h3>
          <h1 id="balance-amount">$0.00 <span class="currency">ORP</span></h1>
          <div class="action-buttons">
            <button id="btn-send" class="btn btn-primary">Send</button>
            <button id="btn-request" class="btn btn-secondary">Request</button>
          </div>
        </section>

        <div class="grid-layout">
          <section class="transaction-panel glass-panel">
            <h3>Send Payment</h3>
            <form id="send-form">
              <div class="input-group">
                <label>To (Username or Address)</label>
                <input type="text" id="tx-to" placeholder="@username or orp1..." required>
              </div>
              <div class="input-group">
                <label>Amount (ORP)</label>
                <input type="number" id="tx-amount" step="0.01" placeholder="0.00" required>
              </div>
              <div class="fee-notice">
                <span>Network Fee:</span>
                <span id="fee-calc">0.00 ORP</span>
              </div>
              <button type="submit" class="btn btn-primary w-100">Send Payment</button>
            </form>
          </section>

          <section class="stats-panel glass-panel">
            <h3>Protocol Economics</h3>
            <p class="stats-desc">Every ORPay transaction automatically burns a 0.1% fee, driving up the value of your ORP holdings.</p>
            
            <div class="stat-box">
              <span class="stat-label">Total ORP Burned by App</span>
              <div class="stat-value fire-text">🔥 <span id="total-burned">0.00</span> ORP</div>
            </div>
            
            <div class="stat-box">
              <span class="stat-label">Current Fee Rate</span>
              <div class="stat-value">0.10%</div>
            </div>
          </section>
        </div>
      </main>
    </div>
    
    <script type="module" src="./main.js"></script>
  </body>
</html>
