# Local devnet: one block producer and one verifying replica.
# Create ./devnet first with `make devnet-init`, then run `make devnet-up`.
services:
  producer:
    build: .
    command: ["-genesis", "/devnet/genesis.json", "-data", "/data"]
    environment:
      ORP_PROPOSER_SEED: ${ORP_PROPOSER_SEED:?run make devnet-init}
    volumes:
      - ./devnet:/devnet:ro
      - producer-data:/data
    ports:
      - "8080:8080"

  replica:
    build: .
    command: ["-follow", "http://producer:8080", "-genesis", "/devnet/genesis.json", "-data", "/data"]
    depends_on:
      - producer
    volumes:
      - ./devnet:/devnet:ro
      - replica-data:/data
    ports:
      - "8081:8080"

volumes:
  producer-data:
  replica-data:
